name: build-packages

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ] # Триггер на теги версий (например, v1.0.0)
  pull_request:
    branches: [ "main" ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Container for Ubuntu/Debian
          - os-name: debian-ubuntu
            image: ubuntu:24.04
            pkg-type: deb
            setup-cmd: |
              apt-get update && apt-get install -y \
                ruby ruby-dev rubygems build-essential gcc make pkg-config \
                libwayland-dev wayland-protocols libcairo2-dev libpango1.0-dev
              gem install --no-document fpm

          # Container for Fedora
          - os-name: fedora
            image: fedora:40
            pkg-type: rpm
            setup-cmd: |
              dnf install -y \
                ruby ruby-devel gcc make pkg-config rpm-build \
                wayland-devel wayland-protocols-devel cairo-devel pango-devel
              gem install --no-document fpm

          # Container for Arch Linux
          - os-name: archlinux
            image: archlinux:latest
            pkg-type: pacman
            setup-cmd: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm \
                gcc make pkgconf git binutils sudo fakeroot \
                wayland wayland-protocols cairo pango
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

    container:
      image: ${{ matrix.image }}
    
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # New step: Extract the version from the tag, or provide a placeholder/commit hash.
      - name: Determine Package Version
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # "refs/tags/v0.5.0-alpha" -> "0.5.0-alpha"
            VERSION="${GITHUB_REF#refs/tags/v}"
            RELEASE="1"
          else
            VERSION="0.0.0"
            RELEASE="git.${GITHUB_SHA::7}"
          fi

          # Hyphens are prohibited in pkgver (Arch) and in RPM versions
          if [ "${{ matrix.pkg-type }}" = "pacman" ]; then
            VERSION="${VERSION//-/_}"      # 0.5.0_alpha
          else
            VERSION="${VERSION//-/\~}"     # 0.5.0~alpha
          fi

          echo "PKG_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PKG_RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Install dependencies and FPM
        run: ${{ matrix.setup-cmd }}

      - name: Compile and Build Package
        run: |
          mkdir -p ../packages_out

          # If it’s Arch Linux, build it using the native makepkg.
          if [ "${{ matrix.pkg-type }}" = "pacman" ]; then
            SRC="$GITHUB_WORKSPACE"
            NAME="plasma-radial-keyboard-${PKG_VERSION}"
            BUILD_DIR=/home/builder/pkgbuild

            # Assemble the archive in a separate directory, outside the repository,
            # ensuring it includes a top-level folder named plasma-radial-keyboard-<version>/
            mkdir -p "$BUILD_DIR/stage"
            cp -a "$SRC" "$BUILD_DIR/stage/$NAME"
            rm -rf "$BUILD_DIR/stage/$NAME/.git"
            tar -czf "$BUILD_DIR/$NAME.tar.gz" -C "$BUILD_DIR/stage" "$NAME"

            # PPKGBUILD: version, valid pkgrel, and a local source instead of a URL
            cp PKGBUILD "$BUILD_DIR/"
            cd "$BUILD_DIR"
            sed -i "s/^pkgver=.*/pkgver=${PKG_VERSION}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
            sed -i "s|^source=.*|source=(\"\${pkgname}-\${pkgver}.tar.gz\")|" PKGBUILD
            grep -q '^options=' PKGBUILD || sed -i "/^pkgdesc=/a options=('!debug')" PKGBUILD

            chown -R builder:builder "$BUILD_DIR"
            sudo -u builder makepkg -sf --noconfirm

            cp "$BUILD_DIR"/*.pkg.tar.zst "$SRC/"
          else
            # Standard logic for Ubuntu and Fedora (as root via FPM)
            export PATH=$PATH:$(ruby -e 'print Gem.user_dir')/bin:/usr/local/bin
            PKG_NAME="plasma-radial-keyboard"
            make
            mkdir -p dist
            make install DESTDIR=$(pwd)/dist PREFIX=/usr
            
            if [ "${{ matrix.pkg-type }}" = "deb" ]; then
              fpm -s dir -t deb -n "$PKG_NAME" -v "$PKG_VERSION" --iteration "$PKG_RELEASE" \
                  -d "libwayland-client0" -d "libcairo2" -d "libpangocairo-1.0-0" -p ../packages_out/ -C dist .
            elif [ "${{ matrix.pkg-type }}" = "rpm" ]; then
              fpm -s dir -t rpm -n "$PKG_NAME" -v "$PKG_VERSION" --iteration "$PKG_RELEASE" \
                  -d "wayland" -d "cairo" -d "pango" -p ../packages_out/ -C dist .
            fi
            
            mv ../packages_out/* .
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os-name }}
          path: |
            *.deb
            *.rpm
            *.pkg.tar.zst

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}