name: build-packages

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ] # Триггер на теги версий (например, v1.0.0)
  pull_request:
    branches: [ "main" ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Container for Ubuntu/Debian
          - os-name: debian-ubuntu
            image: ubuntu:24.04
            pkg-type: deb
            setup-cmd: |
              apt-get update && apt-get install -y \
                ruby ruby-dev rubygems build-essential gcc make pkg-config \
                libwayland-dev wayland-protocols libcairo2-dev libpango1.0-dev
              gem install --no-document fpm

          # Container for Fedora
          - os-name: fedora
            image: fedora:40
            pkg-type: rpm
            setup-cmd: |
              dnf install -y \
                ruby ruby-devel gcc make pkg-config rpm-build \
                wayland-devel wayland-protocols-devel cairo-devel pango-devel
              gem install --no-document fpm

          # Container for Arch Linux
          - os-name: archlinux
            image: archlinux:latest
            pkg-type: pacman
            setup-cmd: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm \
                gcc make pkgconf git binutils sudo \
                wayland wayland-protocols cairo pango
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder .

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Важно для корректной работы с историей тегов

      # Новый шаг: Вытаскиваем версию из тега или ставим заглушку/хэш коммита
      - name: Determine Package Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Извлекаем "1.0.0" из "refs/tags/v1.0.0"
            VERSION=$(echo "${{ github.ref }}" | sed -e 's|refs/tags/v||')
            RELEASE="1"
          else
            # Если это обычный пуш или PR без тега, используем заглушку с хэшем
            VERSION="0.0.0"
            RELEASE="git.$(git rev-parse --short HEAD)"
          fi
          echo "PKG_VERSION=$VERSION" >> $GITHUB_ENV
          echo "PKG_RELEASE=$RELEASE" >> $GITHUB_ENV

      - name: Install dependencies and FPM
        run: ${{ matrix.setup-cmd }}

      - name: Compile and Build Package
        run: |
          mkdir -p ../packages_out

          # Если это Arch Linux, собираем через родной makepkg
          if [ "${{ matrix.pkg-type }}" = "pacman" ]; then
            # Подменяем версию и релиз в файле PKGBUILD на актуальные из CI
            sed -i "s/^pkgver=.*/pkgver=${PKG_VERSION}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=${PKG_RELEASE}/" PKGBUILD
            
            # Архивируем исходники БЕЗОПАСНО: создаем архив уровнем выше, чтобы tar не читал сам себя
            tar -czf "../plasma-radial-keyboard-${PKG_VERSION}.tar.gz" --exclude=".git" .
            mv "../plasma-radial-keyboard-${PKG_VERSION}.tar.gz" .
            
            # Разрешаем пользователю builder читать эту директорию
            chown -R builder:builder .

            # Запускаем сборку через makepkg от пользователя builder
            # -s автоматически ставит зависимости (если бы они были нужны), -f принудительно перезаписывает
            sudo -E -u builder makepkg -sf --noconfirm
          else
            # Стандартная логика для Ubuntu и Fedora (под root через FPM)
            export PATH=$PATH:$(ruby -e 'print Gem.user_dir')/bin:/usr/local/bin
            PKG_NAME="plasma-radial-keyboard"
            make
            mkdir -p dist
            make install DESTDIR=$(pwd)/dist PREFIX=/usr
            
            if [ "${{ matrix.pkg-type }}" = "deb" ]; then
              fpm -s dir -t deb -n "$PKG_NAME" -v "$PKG_VERSION" --iteration "$PKG_RELEASE" \
                  -d "libwayland-client0" -d "libcairo2" -d "libpangocairo-1.0-0" -p ../packages_out/ -C dist .
            elif [ "${{ matrix.pkg-type }}" = "rpm" ]; then
              fpm -s dir -t rpm -n "$PKG_NAME" -v "$PKG_VERSION" --iteration "$PKG_RELEASE" \
                  -d "wayland" -d "cairo" -d "pango" -p ../packages_out/ -C dist .
            fi
            
            mv ../packages_out/* .
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os-name }}
          path: |
            *.deb
            *.rpm
            *.pkg.tar.zst
